<style>
/* Layout: one phone-width column, bottom tab bar, single deliberate dark look (gym floor at night, chalk-lime accent) */
:root{
  --bg:#0B0C0F;--s1:#14161B;--s2:#1C1F26;--s3:#272B34;--line:#2A2E37;
  --fg:#F3F4F1;--mut:#8D929C;--dim:#5B606B;
  --acc:#C8F031;--on-acc:#18200A;--acc-soft:rgba(200,240,49,.14);
  --gold:#FFB23F;--epic:#B57BFF;--rare:#5CB8FF;--bad:#FF6B6B;--bad-soft:rgba(255,107,107,.14);
  --f-disp:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --f-num:'Teko','Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --notch:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 55% at 50% -12%,rgba(200,240,49,.11),transparent 62%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;background:var(--s2);border:0;border-radius:14px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font-family:inherit;width:100%;height:50px;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--fg);padding:0 14px;font-size:16px}
input:focus{outline:none;border-color:var(--acc)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;min-height:100%}
.disp{font-family:var(--f-num);font-weight:600;letter-spacing:.5px;line-height:.9}
.h1{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance;text-transform:uppercase;letter-spacing:.5px}
.h2{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.lab{font-family:var(--f-disp);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,#171A20,var(--s1));border-radius:4px;padding:16px;clip-path:var(--notch)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;font-size:14px;font-weight:500;border-radius:10px;transition:background .15s,color .15s,transform .1s}
.chip.on,.on{background:var(--acc)!important;color:var(--on-acc)!important;box-shadow:0 0 16px rgba(200,240,49,.25)}
.pri{width:100%;height:62px;background:linear-gradient(180deg,#DDFF55,#B5DE1E);color:var(--on-acc);font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border-radius:14px;box-shadow:0 5px 0 #6F8D0C,0 10px 26px rgba(200,240,49,.22),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,box-shadow .08s;margin-bottom:5px}
.pri:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #6F8D0C,0 4px 12px rgba(200,240,49,.2),inset 0 1px 0 rgba(255,255,255,.6)}
.pri.glow{animation:glow 2.2s ease-in-out infinite}
.sec{width:100%;height:52px;font-size:15px;font-weight:600;font-family:var(--f-disp);letter-spacing:.5px;box-shadow:0 3px 0 #0A0B0E,inset 0 1px 0 rgba(255,255,255,.06)}
.sec:active{transform:translateY(2px)!important;box-shadow:0 1px 0 #0A0B0E}
.ghost{width:100%;height:52px;background:none;border:1.5px dashed var(--s3);color:var(--acc);font-weight:500}
.ib{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.list-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s1);border-radius:16px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.ico{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,15,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.tabs .in{display:flex;gap:6px;width:100%;max-width:480px}
.tab{flex:1;height:56px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-disp);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:600;position:relative;transition:color .2s}
.tab::before{content:'';position:absolute;top:-9px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc);box-shadow:0 0 12px var(--acc);transform:scaleX(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab.act{color:var(--acc)}
.tab.act::before{transform:scaleX(1)}
.tab.act .ico{animation:tabPop .4s cubic-bezier(.3,1.8,.5,1)}
.xpbar{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#8DB515,var(--acc) 70%,#EEFF9A);border-radius:4px;transition:width .5s cubic-bezier(.3,.8,.3,1);position:relative;overflow:hidden;box-shadow:0 0 10px rgba(200,240,49,.5)}
.xpbar>i::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 3s ease-in-out infinite}
.lvl{width:48px;height:52px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#E6FF7A,#A9D11A);color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:28px;padding-top:4px;flex-shrink:0;position:relative;overflow:hidden}
.flame{color:var(--gold)}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk>div{text-align:center}
.wk b{display:flex;margin:6px auto 0;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--s2);color:var(--mut)}
.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qc{width:26px;height:26px;border-radius:50%;border:2px solid var(--s3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.qc.ok{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
/* logger */
.step{display:grid;grid-template-columns:72px 1fr 72px;align-items:center}
.step button{height:72px;font-size:32px;font-weight:300;border-radius:18px}
.big{font-family:var(--f-num);font-weight:600;font-size:76px;text-align:center;line-height:.85;padding-top:8px;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(200,240,49,.15)}
.big.bump{animation:bump .18s ease-out}
.rir{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rir button{height:52px;font-size:17px;font-weight:600}
#trk{height:68px;border-radius:34px;background:var(--s2);position:relative;overflow:hidden;touch-action:none}
#knob{position:absolute;left:5px;top:5px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2}
#trkFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc-soft)}
.exnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -2px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex-shrink:0;height:34px;padding:0 12px;font-size:12px;font-weight:500;color:var(--mut)}
.exnav .cur{background:var(--fg);color:var(--bg)}
.exnav .dn{color:var(--acc)}
.exnav .sk{color:var(--dim);text-decoration:line-through}
.bd{font-size:12px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.bd.up{background:var(--acc-soft);color:var(--acc)}.bd.eq{background:var(--s2);color:var(--mut)}.bd.dn{background:var(--bad-soft);color:var(--bad)}
.boss{--rc:#7A2A3A;background:#1A0F14;padding:14px}
.hp{height:14px;background:#2A1219;border-radius:7px;overflow:hidden;position:relative}
.hp>i{display:block;height:100%;background:linear-gradient(90deg,#FF4D5E,#FF8A3D);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{background:var(--s1);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));animation:sheetUp .3s cubic-bezier(.2,1,.3,1)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:45;width:min(440px,calc(100% - 32px))}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast span{flex:1}
.toast button{background:none;color:#4B6B00;font-weight:700;height:36px;padding:0 10px}
.prpop{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-30px) scale(.9);background:var(--acc);color:var(--on-acc);border-radius:18px;padding:12px 22px;text-align:center;opacity:0;transition:.4s cubic-bezier(.2,1.5,.4,1);z-index:46;pointer-events:none}
.prpop.show{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:49}
.badge{background:var(--s1);border-radius:16px;padding:14px 6px 12px;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge .bi{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s2)}
.badge.got{color:var(--fg)}
.flip{width:180px;height:210px;margin:0 auto;perspective:900px}
.card3{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:12px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face.back::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);left:-60%;animation:shine 1.6s .9s ease-out}
.sc{background:linear-gradient(180deg,#191C23,var(--s1));clip-path:var(--notch);padding:12px 6px;text-align:center;opacity:0}
.sc b{display:block;font-family:var(--f-num);font-size:40px;font-weight:600;line-height:.9;margin-top:6px}
.shk{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
@keyframes slam{0%{transform:scale(2.6);opacity:0;letter-spacing:14px}60%{transform:scale(.92);opacity:1}100%{transform:scale(1);letter-spacing:.5px;opacity:1}}
@keyframes rise{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes up{to{transform:translateY(-100%);opacity:0}}
@keyframes inn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{from{left:-60%}to{left:130%}}
@keyframes flashA{from{opacity:.85}to{opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both}
.view.enter{animation:viewIn .38s cubic-bezier(.2,1,.3,1)}
.view.enter .stack>*,.view.enter .wk>div,.view.enter .card,.view.enter .banner{animation:rise2 .45s cubic-bezier(.2,1.3,.4,1) both}
.view.enter .stack>*:nth-child(2),.view.enter .wk>div:nth-child(2){animation-delay:.04s}
.view.enter .stack>*:nth-child(3),.view.enter .wk>div:nth-child(3){animation-delay:.08s}
.view.enter .stack>*:nth-child(4),.view.enter .wk>div:nth-child(4){animation-delay:.12s}
.view.enter .stack>*:nth-child(5),.view.enter .wk>div:nth-child(5){animation-delay:.16s}
.view.enter .stack>*:nth-child(6),.view.enter .wk>div:nth-child(6){animation-delay:.2s}
.view.enter .stack>*:nth-child(n+7),.view.enter .wk>div:nth-child(7){animation-delay:.24s}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes rise2{from{opacity:0;transform:translateY(16px)}}
@keyframes shimmer{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes glow{0%,100%{box-shadow:0 5px 0 #6F8D0C,0 10px 26px rgba(200,240,49,.22),inset 0 1px 0 rgba(255,255,255,.6)}50%{box-shadow:0 5px 0 #6F8D0C,0 10px 40px rgba(200,240,49,.5),inset 0 1px 0 rgba(255,255,255,.6)}}
@keyframes tabPop{0%{transform:scale(1)}40%{transform:scale(1.3) translateY(-2px)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.sheet{border-top:2px solid var(--acc);box-shadow:0 -10px 40px rgba(200,240,49,.12)}
.list-row{border-radius:10px;transition:background .15s}
.list-row:active{background:var(--s2)}
.boss{clip-path:var(--notch);border-radius:4px}
/* Outline for notched cards: inset shadow draws the straight edges, two corner gradients draw the diagonal cuts. */
.ring,.boss{box-shadow:inset 0 0 0 1.5px var(--rc,var(--acc))}
.ring{background:linear-gradient(135deg,transparent 6.9px,var(--rc) 6.9px,var(--rc) 8.6px,transparent 8.6px) 0 0/14px 14px no-repeat,linear-gradient(-45deg,transparent 6.9px,var(--rc) 6.9px,var(--rc) 8.6px,transparent 8.6px) 100% 100%/14px 14px no-repeat,linear-gradient(180deg,#171A20,var(--s1))}
.boss{background:linear-gradient(135deg,transparent 6.9px,var(--rc) 6.9px,var(--rc) 8.6px,transparent 8.6px) 0 0/14px 14px no-repeat,linear-gradient(-45deg,transparent 6.9px,var(--rc) 6.9px,var(--rc) 8.6px,transparent 8.6px) 100% 100%/14px 14px no-repeat,#1A0F14}
.badge{clip-path:var(--notch);border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
//CORE-START
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const RR=['4–6','6–10','8–12','10–15','15–20'];
const rrLo=s=>+s.split('–')[0], rrHi=s=>+s.split('–')[1];
const MUS=['Chest','Back','Shoulders','Quads','Hamstrings','Glutes','Biceps','Triceps','Calves','Abs','Cardio'];
const BASE_LIB={Chest:['Bench press','Incline DB press','Machine chest press','Cable fly','Dips','Push-up','Knee push-up','Decline push-up','Archer push-up'],Back:['Lat pulldown','Pull-up','Barbell row','Seated cable row','Chest-supported row','Deadlift','Dead hang'],Shoulders:['Overhead press','DB shoulder press','Lateral raise','Cable lateral raise','Rear delt fly'],Quads:['Back squat','Front squat','Leg press','Hack squat','Leg extension','Bulgarian split squat','Goblet squat','Bodyweight squat','Lunges','Pistol squat','Wall sit'],Hamstrings:['Romanian deadlift','Lying leg curl','Seated leg curl'],Glutes:['Hip thrust','Cable kickback','Glute bridge'],Biceps:['DB curl','Cable curl','Hammer curl','Preacher curl'],Triceps:['Rope pushdown','Overhead extension','Skull crusher','Close-grip bench','Bench dips'],Calves:['Standing calf raise','Seated calf raise','Bodyweight calf raise'],Abs:['Cable crunch','Hanging leg raise','Crunches','Plank','Side plank','Hollow hold','L-sit'],Cardio:['Treadmill walk','Incline walk','Treadmill run','Cycling','Cross trainer','Stair climber']};
// Bodyweight moves: logged as reps, with optional extra weight (vest, dumbbell, plate).
const BW=new Set(['Push-up','Knee push-up','Decline push-up','Archer push-up','Pistol squat','Pull-up','Dips','Bodyweight squat','Lunges','Bulgarian split squat','Glute bridge','Bench dips','Bodyweight calf raise','Hanging leg raise','Crunches']);
// Timed holds: logged in seconds (r holds the seconds), optional extra weight.
const HOLD=new Set(['Plank','Side plank','Hollow hold','Wall sit','Dead hang','L-sit']);
function kindOf(e,kinds){return e.k||(e.m==='Cardio'?'c':(kinds&&kinds[e.n])||(BW.has(e.n)?'bw':HOLD.has(e.n)?'h':'w'))}
function holdSuggest(ex,hist){
  const H=hist[ex.n]||[],n=ex.sets||3,inc=ex.inc||2.5,fill=a=>Array.from({length:n},(_,i)=>a[Math.min(i,a.length-1)]);
  if(!H.length)return{w:0,reps:fill([30]),why:'First time. Hold with clean form and stop just before you start shaking.',tag:'eq',first:true};
  const cur=H[H.length-1],p=H[H.length-2],l=cur.sets,W0=l[0].w,mn=Math.min(...l.map(s=>s.r));
  if(mn>=60)return{w:W0+inc,reps:fill([40]),why:`Every set held 60 s. Add ${fmt(inc)} kg (plate on your back) or move to a harder version.`,tag:'up'};
  if(p&&p.sets[0].w===W0&&tot(cur)<tot(p))return{w:W0,reps:fill(l.map(s=>s.r)),why:'Shorter holds than last time. Same target today.',tag:'eq'};
  return{w:W0,reps:fill(l.map(s=>Math.min(60,s.r+5))),why:'Add 5 seconds to each hold.',tag:'up'};
}
const dist=c=>c.min/60*c.kmh;
// ACSM metabolic equations: walking below 8 km/h, running at or above.
function kcal(c,bw){const v=c.kmh*1000/60,g=c.inc/100,vo2=c.kmh>=8?0.2*v+0.9*v*g+3.5:0.1*v+1.8*v*g+3.5;return vo2*bw/1000*5*c.min}
function cardioSuggest(ex,hist){
  const H=hist[ex.n]||[],run=/run/i.test(ex.n),walk=/walk/i.test(ex.n);
  if(!H.length)return{c:{min:run?15:20,kmh:run?8:walk?5:0,inc:/incline/i.test(ex.n)?6:0},why:'First time. Keep it at a pace where you can still talk.',tag:'eq',first:true,w:0,reps:[1]};
  const l=H[H.length-1].sets[0],c={min:l.min,kmh:l.kmh,inc:l.inc};let why;
  if(l.eff==='hard')return{c,why:'Last time felt hard. Keep these settings until you can talk through it (zone 2).',tag:'eq',w:0,reps:[1]};
  if(l.min<30){c.min=l.min+2;why='Same pace, 2 minutes longer.'}
  else if(walk&&l.inc<12){c.inc=l.inc+1;why='You did 30 min. Add 1% incline.'}
  else if(l.kmh>0){c.kmh=Math.round((l.kmh+.5)*10)/10;why='You did 30 min. Add 0.5 km/h.'}
  else{c.min=l.min+2;why='Go 2 minutes longer.'}
  // Keep weekly cardio growth to about 10%.
  const T=today(),wk=cardioMin(hist,addDays(T,-7),T),pw=cardioMin(hist,addDays(T,-14),addDays(T,-7));
  if(pw>0&&c.min>l.min&&wk+c.min>pw*1.1){c.min=l.min;why='Your cardio time is already up about 10% on last week. Hold the time for now.';return{c,why,tag:'eq',w:0,reps:[1]}}
  return{c,why,tag:'up',w:0,reps:[1]};
}
function cardioMin(hist,from,to){let m=0;for(const n in hist)for(const h of hist[n])if(h.d&&h.d>=from&&h.d<to)for(const s of h.sets)m+=s.min||0;return m}
const LADDERS=[['Knee push-up','Push-up','Decline push-up','Archer push-up'],['Bodyweight squat','Bulgarian split squat','Pistol squat'],['Glute bridge','Hip thrust'],['Bench dips','Dips'],['Bodyweight calf raise','Standing calf raise']];
const harder=n=>{for(const l of LADDERS){const i=l.indexOf(n);if(i>=0&&i<l.length-1)return l[i+1]}return null};
// 4 build weeks with falling RIR (3,2,1,0-1), then 1 deload week.
function mesoInfo(start,T,len=4){const d=Math.floor((new Date(T+'T12:00:00')-new Date(start+'T12:00:00'))/864e5),w=Math.max(0,Math.floor(d/7))%(len+1);return w===len?{wk:len+1,deload:true,rir:3,len}:{wk:w+1,deload:false,rir:3-w,len}}
const SMALL=/raise|fly|curl|extension|kickback|crunch|pushdown/i;
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtDate(new Date());
const dow=ds=>(new Date(ds+'T12:00:00').getDay()+6)%7;
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return fmtDate(d)};
const rnd=(x,inc)=>Math.round(x/inc)*inc;
const fmt=x=>String(Math.round(x*100)/100);
const e1=(w,r)=>w*(1+r/30);
const tot=h=>h.sets.reduce((a,b)=>a+b.r,0);

function suggest(ex,hist){
  const k=kindOf(ex);
  if(k==='c')return cardioSuggest(ex,hist);
  if(k==='h')return holdSuggest(ex,hist);
  const r=liftSuggest(ex,hist),H=hist[ex.n]||[],W0=H.length?H[H.length-1].sets[0].w:0;
  if(k==='bw'){
    if(r.first)r.why='First time. Do clean reps and stop with about 2 left in the tank.';
    else if(r.tag==='up'&&r.w>W0&&W0===0){r.harder=harder(ex.n);r.why=`Every set hit the top of the range. ${r.harder?`Move up to ${r.harder}, or hold`:'Hold'} a ${fmt(r.w)} kg dumbbell, or slow down to 3 seconds on the way down.`}
  }
  // Plateau: best estimated 1RM flat across the last 3 sessions while the weight is not going up.
  if(H.length>=3&&!r.first&&r.w===W0&&r.tag!=='dn'){
    const b=h=>Math.max(...h.sets.map(s=>e1((k==='bw'?(typeof S!=='undefined'&&S.bw||70):0)+s.w,s.r))),a=H.slice(-3).map(b);
    if(a[2]<=a[0]*1.005){r.plateau=true;r.tag='eq';r.why=`No progress in 3 sessions. Try a variation, or switch to ${ex.rr==='10–15'?'6–10':'10–15'} reps for a few weeks.`}
  }
  return r;
}
function liftSuggest(ex,hist){
  const H=hist[ex.n]||[],lo=rrLo(ex.rr),hi=rrHi(ex.rr),inc=ex.inc||2.5,n=ex.sets;
  const fill=a=>Array.from({length:n},(_,i)=>a[Math.min(i,a.length-1)]);
  const mid=Math.round((lo+hi)/2);
  if(!H.length)return{w:0,reps:fill([mid]),why:`First time. Pick a weight you can lift ${mid} times with 2 reps left.`,tag:'eq',first:true};
  const cur=H[H.length-1],prev=H[H.length-2],pp=H[H.length-3];
  const W0=cur.sets[0].w,reps=cur.sets.map(s=>s.r),rirs=cur.sets.map(s=>s.rir);
  const minR=Math.min(...rirs),avg=rirs.reduce((a,b)=>a+b,0)/rirs.length;
  const dropped=(a,b)=>!!(a&&b&&a.sets[0].w===b.sets[0].w&&tot(b)<tot(a));
  if(prev&&W0>prev.sets[0].w&&reps.some(r=>r<lo))return{w:prev.sets[0].w,reps:fill(prev.sets.map(s=>Math.min(hi,s.r+1))),why:`${fmt(W0)} kg was too big a jump. Back to ${fmt(prev.sets[0].w)} kg and build reps.`,tag:'dn'};
  if(reps.every(r=>r>=hi)&&minR>=1)return{w:W0+inc,reps:fill([Math.min(hi,lo+2)]),why:`Every set hit ${hi} with reps to spare. Add ${fmt(inc)} kg.`,tag:'up'};
  if(avg>=3)return{w:W0+inc,reps:fill(reps.map(r=>Math.max(lo,r-1))),why:`Last time felt easy. Add ${fmt(inc)} kg.`,tag:'up'};
  if(dropped(prev,cur)){
    if(dropped(pp,prev))return{w:rnd(W0*0.9,inc),reps:fill([Math.min(hi,lo+2)]),why:'Reps dropped two sessions in a row. Drop 10% and build back up.',tag:'dn'};
    return{w:W0,reps:fill(reps),why:'Reps dipped last time. Same weight, match it today.',tag:'eq'};
  }
  return{w:W0,reps:fill(reps.map(r=>Math.min(hi,r+1))),why:'In range. Same weight, one more rep per set.',tag:'up'};
}

function missedSince(last,until,week){
  let m=0,d=addDays(last,1),g=0;
  while(d<until&&g++<400){if(typeof week==='function'?week(d):week[dow(d)])m++;d=addDays(d,1)}
  return m;
}
function bumpStreak(st,T,week){
  if(st.last===T)return{n:st.n,used:0};
  let used=0;
  if(!st.last)st.n=1;
  else{const m=missedSince(st.last,T,week);if(m===0)st.n++;else if(m<=st.freezes){st.freezes-=m;used=m;st.n++}else st.n=1}
  st.last=T;
  if(st.n%7===0&&st.freezes<2)st.freezes++;
  return{n:st.n,used};
}
function liveStreak(st,T,week){
  if(!st.last)return 0;
  return missedSince(st.last,T,week)>st.freezes?0:st.n;
}
const needFor=l=>200+100*l;
function levelInfo(xp){let l=1,x=xp;while(x>=needFor(l)){x-=needFor(l);l++}return{lv:l,into:Math.round(x),need:needFor(l)}}
const RANKS=[[1,'Bronze','#C98A5B'],[5,'Silver','#C9D1DC'],[10,'Gold','#FFB23F'],[15,'Platinum','#7FE3D4'],[20,'Diamond','#9FB8FF'],[30,'Titan','#B57BFF']];
const rankOf=lv=>{let r=RANKS[0];for(const x of RANKS)if(lv>=x[0])r=x;return r};
//CORE-END

/* ---------- state ---------- */
const KEY='ironquest-v1';
const BADGES=[
 {k:'first',n:'First rep',d:'Finish your first workout',r:'common',i:'i-dumbbell'},
 {k:'s3',n:'On fire',d:'3-day streak',r:'common',i:'i-flame'},
 {k:'s7',n:'Iron week',d:'7-day streak',r:'rare',i:'i-flame'},
 {k:'s30',n:'Unbreakable',d:'30-day streak',r:'legendary',i:'i-crown'},
 {k:'pr1',n:'Record breaker',d:'Set your first PR',r:'common',i:'i-trophy'},
 {k:'pr25',n:'PR machine',d:'25 PRs',r:'epic',i:'i-trophy'},
 {k:'boss',n:'Boss slayer',d:'Beat your nemesis exercise',r:'epic',i:'i-skull'},
 {k:'t10',n:'Ten tonnes',d:'10,000 kg in one session',r:'rare',i:'i-weight'},
 {k:'n10',n:'Regular',d:'10 workouts',r:'common',i:'i-calendar'},
 {k:'n50',n:'Lifer',d:'50 workouts',r:'epic',i:'i-calendar'},
 {k:'q',n:'Perfect day',d:'All 3 quests in one day',r:'rare',i:'i-target'},
 {k:'freeze',n:'Saved',d:'A streak freeze saved you',r:'rare',i:'i-snow'}
];
const RC={common:'#9AA3AE',rare:'#5CB8FF',epic:'#B57BFF',legendary:'#FFB23F'};

function exampleState(){
  const T=today(),id=()=>Math.random().toString(36).slice(2,9);
  const E=(n,m,sets,rr)=>({n,m,k:kindOf({n,m}),sets,rr,inc:SMALL.test(n)?1:2.5});
  const push={id:id(),name:'Push',ex:[E('Bench press','Chest',3,'6–10'),E('Overhead press','Shoulders',3,'6–10'),E('Incline DB press','Chest',3,'8–12'),E('Lateral raise','Shoulders',3,'10–15'),E('Rope pushdown','Triceps',3,'10–15')]};
  const pull={id:id(),name:'Pull',ex:[E('Lat pulldown','Back',3,'6–10'),E('Barbell row','Back',3,'6–10'),E('Seated cable row','Back',3,'8–12'),E('DB curl','Biceps',3,'10–15'),E('Hammer curl','Biceps',2,'10–15'),E('Plank','Abs',3,'20–60')]};
  const legs={id:id(),name:'Legs',ex:[E('Back squat','Quads',3,'6–10'),E('Romanian deadlift','Hamstrings',3,'8–12'),E('Leg press','Quads',3,'10–15'),E('Lying leg curl','Hamstrings',3,'10–15'),E('Bodyweight calf raise','Calves',3,'15–20'),E('Incline walk','Cardio',1,'10–15')]};
  const H=(w,rs,rir,daysAgo)=>({d:addDays(T,-daysAgo),sets:rs.map(r=>({w,r,rir}))});
  const hist={
    'Bench press':[H(57.5,[10,9,9],1,10),H(60,[10,10,10],1,3)],
    'Overhead press':[H(37.5,[8,8,7],1,10),H(37.5,[9,8,8],1,3)],
    'Incline DB press':[H(24,[12,11,10],2,10),H(24,[12,12,11],2,3)],
    'Lateral raise':[H(10,[15,14,13],2,10),H(10,[15,15,14],2,3)],
    'Rope pushdown':[H(25,[12,12,11],2,3)],
    'Lat pulldown':[H(55,[10,9,9],1,9),H(55,[10,10,9],1,2)],
    'Barbell row':[H(60,[8,8,7],1,9),H(60,[8,8,8],2,2)],
    'Back squat':[H(80,[8,7,7],1,22),H(80,[7,7,6],0,15)],
    'Romanian deadlift':[H(70,[10,9,9],2,1)],
    'Leg press':[H(140,[12,12,11],2,1)],
    'Plank':[H(0,[40,35,35],1,9),H(0,[45,40,40],1,2)],
    'Bodyweight calf raise':[H(0,[20,20,19],1,8),H(0,[20,20,20],1,1)],
    'Incline walk':[{d:addDays(T,-8),sets:[{w:0,r:0,min:20,kmh:5,inc:6}]},{d:addDays(T,-1),sets:[{w:0,r:0,min:22,kmh:5,inc:6}]}]
  };
  // Every day gets a workout in the example so "today" always has something to try.
  const week=[push.id,pull.id,legs.id,push.id,pull.id,legs.id,legs.id];
  const sessions=[{d:addDays(T,-3),name:'Push',vol:6120,prs:1,xp:260},{d:addDays(T,-2),name:'Pull',vol:5480,prs:0,xp:210},{d:addDays(T,-1),name:'Legs',vol:7350,prs:0,xp:190}];
  return{v:1,example:true,lib:JSON.parse(JSON.stringify(BASE_LIB)),workouts:[push,pull,legs],week,hist,sessions,xp:1680,
    streak:{n:4,last:addDays(T,-1),freezes:1},badges:{first:addDays(T,-20),s3:addDays(T,-2),pr1:addDays(T,-10)},
    skips:{'Back squat':2},prCount:6,quest:{d:'',done:[]},set:{sound:true,haptics:true},bw:70,kinds:{},ovr:{},meso:{start:addDays(weekStart(T),-7)},savedAt:0};
}
function emptyState(){return{v:1,example:false,lib:JSON.parse(JSON.stringify(BASE_LIB)),workouts:[],week:[null,null,null,null,null,null,null],hist:{},sessions:[],xp:0,streak:{n:0,last:'',freezes:0},badges:{},skips:{},prCount:0,quest:{d:'',done:[]},set:{sound:true,haptics:true},bw:70,kinds:{},savedAt:0}}
// Older saves predate cardio and bodyweight: add the new library entries and defaults.
function migrate(s){
  s.bw=s.bw||70;s.kinds=s.kinds||{};s.best=s.best||{};s.ovr=s.ovr||{};s.meso=s.meso||{start:weekStart(today())};
  const old=addDays(today(),-21);for(const d in s.ovr)if(d<old)delete s.ovr[d];
  for(const w of s.workouts)for(const e of w.ex)if(HOLD.has(e.n)&&e.k!=='h'){e.k='h';e.rr='20–60'}
  for(const m of MUS){s.lib[m]=s.lib[m]||[];for(const n of BASE_LIB[m])if(!s.lib[m].includes(n))s.lib[m].push(n)}
  return s;
}

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==1)S=exampleState();
migrate(S);
/* Sync. One private online doc per person. Another device may write it while this one is open:
   baseAt = online version this device last matched, remote = newest online copy seen.
   Before writing, if the online copy moved on, merge it in instead of overwriting it. */
let DOC=null,saving=false,pendingSave=false,baseAt=0,basePlan='',remote=null,warned={};
const planSig=s=>JSON.stringify([s.workouts,s.week,s.lib,s.kinds,s.ovr,s.meso,s.bw,s.set]);
function warnOnce(k,m){const n=Date.now();if(warned[k]&&n-warned[k]<60000)return;warned[k]=n;setTimeout(()=>toast(m),0)}
function storeLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!DOC)warnOnce('ls',"Not saved on this device. Private mode or full storage can block saving.")}}
function save(){S.savedAt=Date.now();storeLocal();pushRemote()}
function mergeIn(r,local){
  const m=migrate(JSON.parse(JSON.stringify(r))),sk=s=>s.d+'|'+s.name+'|'+s.xp+'|'+s.vol;
  const have=new Set(m.sessions.map(sk)),added=local.sessions.filter(s=>!have.has(sk(s)));
  m.sessions.push(...added);m.sessions.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);if(m.sessions.length>120)m.sessions=m.sessions.slice(-120);
  for(const s of added){m.xp+=s.xp||0;m.prCount=(m.prCount||0)+(s.prs||0)}
  for(const n in local.hist){const hk=h=>h.d+JSON.stringify(h.sets),hs=new Set((m.hist[n]||[]).map(hk));
    for(const h of local.hist[n])if(!hs.has(hk(h)))(m.hist[n]=m.hist[n]||[]).push(h);
    m.hist[n].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);if(m.hist[n].length>12)m.hist[n]=m.hist[n].slice(-12)}
  for(const k in local.badges)if(!m.badges[k])m.badges[k]=local.badges[k];
  for(const k in local.best||{})m.best[k]=Math.max(m.best[k]||0,local.best[k]);
  for(const k in local.skips)if(added.length)m.skips[k]=local.skips[k];
  if((local.streak.last||'')>(m.streak.last||''))m.streak=local.streak;
  if((local.quest.d||'')>=(m.quest.d||''))m.quest=local.quest;
  if(planSig(local)!==basePlan)for(const k of ['workouts','week','lib','kinds','ovr','meso','bw','set'])m[k]=local[k];
  return m;
}
function adopt(r){S=migrate(r);baseAt=S.syncAt=r.savedAt||0;basePlan=planSig(S);storeLocal();if(view!=='log'&&view!=='reward')render()}
async function pushRemote(){
  if(!DOC)return;
  if(saving){pendingSave=true;return}
  saving=true;
  // Read before write, so a device that missed the live update still sees the other device's changes.
  try{const sn=await DOC.get(),d=sn.exists?sn.data():null;if(d&&d.v===1&&(d.savedAt||0)>((remote&&remote.savedAt)||0))remote=d}catch(e){}
  if(remote&&(remote.savedAt||0)>baseAt){S=mergeIn(remote,S);S.savedAt=Date.now();storeLocal();if(view!=='log'&&view!=='reward')render();toast('Merged with your other device')}
  const snap=JSON.parse(JSON.stringify(S));
  try{await DOC.set(snap);baseAt=S.syncAt=snap.savedAt;remote=snap;basePlan=planSig(snap);storeLocal()}
  catch(e){warnOnce('db','Online sync failed. Your data is still on this phone.')}
  saving=false;if(pendingSave){pendingSave=false;pushRemote()}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uidv=await user.id();if(!uidv)return;
    DOC=db.collection('data/users/'+uidv).doc('state');
    const snap=await DOC.get();
    const r=snap.exists?snap.data():null;
    // S.syncAt = the online version this device last matched (kept across reloads), so clock gaps between devices don't matter.
    baseAt=S.syncAt||0;basePlan=planSig(S);
    if(r&&r.v===1){remote=r;const local=(S.savedAt||0)>baseAt;
      if((r.savedAt||0)!==baseAt){if(local&&baseAt)pushRemote();else adopt(r)}
      else if(local)pushRemote()}
    else if(S.savedAt)pushRemote();
    // Live updates from the other device: take them when nothing here is unsaved, else merge on next write.
    DOC.onSnapshot(sn=>{const d=sn.exists?sn.data():null;if(!d||d.v!==1||(d.savedAt||0)<=((remote&&remote.savedAt)||0))return;remote=d;if((S.savedAt||0)<=baseAt)adopt(d);else pushRemote()},()=>{});
  }catch(e){}
})();

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.08,dl=0,f2){if(!S.set.sound)return;const a=ac();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus(a));o.start(t);o.stop(t+d+.05)}
function noise(d,v=.15,fq=1200){if(!S.set.sound)return;const a=ac();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;s.buffer=b;g.gain.value=v;s.connect(f).connect(g).connect(bus(a));s.start()}
// Master bus: soft compressor plus a short generated room reverb so every sound feels "produced".
let BUS=null;
function bus(a){
  if(BUS)return BUS;
  const inp=a.createGain(),comp=a.createDynamicsCompressor(),rv=a.createConvolver(),wet=a.createGain(),len=Math.floor(a.sampleRate*1.1),ir=a.createBuffer(2,len,a.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  rv.buffer=ir;wet.gain.value=.16;comp.threshold.value=-18;comp.ratio.value=4;
  inp.connect(comp);inp.connect(rv).connect(wet).connect(comp);comp.connect(a.destination);
  return BUS=inp;
}
let lastTap=0;
const sfx={
  tap(){const n=performance.now();if(n-lastTap<60)return;lastTap=n;tone(2200,.025,'sine',.03);tone(1300,.04,'triangle',.02,.01)},
  whoosh(){if(!S.set.sound)return;const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*.28),b=a.createBuffer(1,len,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2600,t+.28);g.gain.value=.12;s.buffer=b;s.connect(f).connect(g).connect(bus(a));s.start()},
  set(){tone(660,.09,'triangle',.07);tone(990,.14,'triangle',.06,.06);tone(1980,.25,'sine',.03,.12)},
  pr(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.08,i*.08))},
  slam(){tone(140,.4,'sawtooth',.12,0,40);noise(.35,.2)},
  pop(){tone(520,.12,'triangle',.07)},
  tick(n){tone(900+n*30,.07,'sine',.05)},
  level(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.5,'triangle',.08,i*.07));tone(60,.8,'sine',.25,0,30);noise(.6,.25)},
  flip(){tone(300,.25,'sine',.06,0,900);[784,988,1175].forEach((f,i)=>tone(f,.6,'sine',.06,.35+i*.05))},
  hit(){tone(90,.25,'square',.1,0,45);noise(.18,.25,800)},
  bossDown(){tone(70,1.1,'sawtooth',.14,0,25);noise(.9,.3,600);[392,523,659,784].forEach((f,i)=>tone(f,.6,'triangle',.07,.25+i*.09))},
  bell(){[880,1320].forEach((f,i)=>tone(f,.9,'sine',.07,i*.12))},
  warn(){tone(300,.18,'triangle',.07);tone(240,.25,'triangle',.07,.16)}
};

const cv=document.getElementById('fx'),cx=cv.getContext('2d');
let P=[],O=[],RG=[],rays={a:0,al:0,x:0,y:0,c:'200,240,49'},fxOn=false;
function fxSize(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fxSize);fxSize();
function burst(x,y,n,cols,sp=7,sz=3){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp+1;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:40+Math.random()*40,s:Math.random()*sz+1,c:cols[i%cols.length]})}kick()}
function ring(x,y,max,c='200,240,49',delay=0){RG.push({x,y,r:8,max,l:-delay,c});kick()}
function kick(){if(!fxOn){fxOn=true;requestAnimationFrame(loop)}}
function loop(){
  const w=innerWidth,h=innerHeight;cx.clearRect(0,0,w,h);
  if(rays.al>.01){cx.save();cx.translate(rays.x,rays.y);cx.rotate(rays.a+=.01);for(let i=0;i<14;i++){cx.rotate(Math.PI*2/14);const g=cx.createLinearGradient(0,0,0,-h);g.addColorStop(0,`rgba(${rays.c},${.32*rays.al})`);g.addColorStop(1,`rgba(${rays.c},0)`);cx.fillStyle=g;cx.beginPath();cx.moveTo(0,0);cx.lineTo(-30,-h);cx.lineTo(30,-h);cx.fill()}cx.restore()}
  cx.globalCompositeOperation='lighter';
  RG=RG.filter(r=>{r.l++;if(r.l<0)return true;r.r+=(r.max-r.r)*.09;const al=1-r.l/40;if(al<=0)return false;cx.strokeStyle=`rgba(${r.c},${al})`;cx.lineWidth=6*al+1;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke();return true});
  P=P.filter(p=>{p.l++;p.vx*=.96;p.vy=p.vy*.96+.09;p.x+=p.vx;p.y+=p.vy;const al=1-p.l/p.m;if(al<=0)return false;cx.globalAlpha=al;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();return true});
  O=O.filter(o=>{o.t+=1/o.d;const t=Math.min(1,o.t),e=t*t*(3-2*t),u=1-e;const x=u*u*o.x0+2*u*e*o.cx+e*e*o.x1,y=u*u*o.y0+2*u*e*o.cy+e*e*o.y1;
    o.tr.push([x,y]);if(o.tr.length>10)o.tr.shift();o.tr.forEach((q,i)=>{cx.globalAlpha=i/10*.6;cx.fillStyle='#C8F031';cx.beginPath();cx.arc(q[0],q[1],2+i*.3,0,7);cx.fill()});
    cx.globalAlpha=1;cx.fillStyle='#F4FFD0';cx.shadowColor='#C8F031';cx.shadowBlur=18;cx.beginPath();cx.arc(x,y,5,0,7);cx.fill();
    if(t>=1){o.hit&&o.hit();burst(x,y,6,['#C8F031','#fff'],3,2);return false}return true});
  cx.globalAlpha=1;cx.shadowBlur=0;cx.globalCompositeOperation='source-over';
  if(P.length||O.length||RG.length||rays.al>.01)requestAnimationFrame(loop);else{fxOn=false;cx.clearRect(0,0,w,h)}
}
function flash(){const f=document.getElementById('flash');f.style.animation='none';void f.offsetWidth;f.style.animation='flashA .5s ease-out'}
function shake(el){el=el||document.getElementById('app');el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk')}
function center(el,ax=.5,ay=.5){const r=el.getBoundingClientRect();return{x:r.left+r.width*ax,y:r.top+r.height*ay}}
function raysOn(x,y,c){rays.x=x;rays.y=y;rays.c=c||'200,240,49';const f=()=>{rays.al=Math.min(1,rays.al+.06);kick();if(rays.al<1)requestAnimationFrame(f)};f()}
function raysOff(){const f=()=>{rays.al=Math.max(0,rays.al-.03);if(rays.al>0)requestAnimationFrame(f)};f()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function countUp(el,to,ms){return new Promise(r=>{const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();p<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)})}

function weekStart(T){return addDays(T,-dow(T))}
// What is scheduled on a date: this-week overrides (from "Shift my week") win over the weekly plan.
function planFor(ds){return S.ovr&&ds in S.ovr?S.ovr[ds]:S.week[dow(ds)]}
function missedDay(T){
  for(let i=1;i<=3;i++){const d=addDays(T,-i),w=W(planFor(d));
    if(w&&w.ex.length&&!doneOn(d)&&S.dismiss!==d&&!S.sessions.some(s=>s.d>d))return d}
  return null;
}
function shiftWeek(D){
  const T=today(),end=addDays(weekStart(T),6),n=Math.round((new Date(T+'T12:00:00')-new Date(D+'T12:00:00'))/864e5),days=[];
  for(let d=D;d<=end;d=addDays(d,1))days.push(d);
  const old=days.map(planFor),dropped=[];
  days.forEach(d=>{if(d<T)S.ovr[d]=null});
  days.forEach((d,i)=>{const t=addDays(d,n);if(t<=end)S.ovr[t]=old[i];else if(W(old[i]))dropped.push(W(old[i]).name)});
  save();sfx.pop();hap(20);render();
  toast(dropped.length?`Week shifted. ${dropped.join(', ')} moves off this week.`:'Week shifted. Nothing is lost.');
}

  if(w&&!done&&st===0&&S.streak.n>1)h+=`<div class="banner" style="background:var(--bad-soft);color:var(--bad);margin-bottom:12px">${ic('i-flame')}<span style="flex:1">Your ${S.streak.n}-day streak ended. Start a new one today.</span></div>`;

    </div>`;
  }else{
    h+=`<div class="card stack"><div class="lab">Today · ${DAYS[di]}</div><div class="h1">Rest day</div><div class="mut">Your streak is safe. Muscles grow while you recover.</div><button class="sec" onclick="pickAny()">Train anyway</button></div>`;

// Finished-today card: today's numbers, recovery, and a preview of the next training day.
function doneCard(T){
  const ss=S.sessions.filter(s=>s.d===T),last=ss[ss.length-1];
  const vol=ss.reduce((a,s)=>a+(s.vol||0),0),prs=ss.reduce((a,s)=>a+(s.prs||0),0),xp=ss.reduce((a,s)=>a+(s.xp||0),0),mins=ss.reduce((a,s)=>a+(s.min||0),0);
  const stat=(v,l,c='var(--fg)')=>`<div style="text-align:center;min-width:0"><div class="disp num" style="font-size:30px;color:${c}">${v}</div><div class="lab" style="font-size:9px">${l}</div></div>`;
  const mus=[...new Set(Object.keys(S.hist).filter(n=>S.hist[n].some(h=>h.d===T)).map(n=>MUS.find(m=>S.lib[m].includes(n))).filter(m=>m&&m!=='Cardio'))];
  let nd=null,nw=null;for(let i=1;i<=7;i++){const d=addDays(T,i),w=W(planFor(d));if(w&&w.ex.length){nd=d;nw=w;break}}
  const dayName=nd?(nd===addDays(T,1)?'Tomorrow':DAYS[dow(nd)]):'';
  let nx='';
  if(nw){const items=nw.ex.slice(0,3).map(e=>{const k=K(e),sg=suggest({...e,k},S.hist);return `<div class="between" style="font-size:13px"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.n)}</span><span class="mut num" style="flex-shrink:0">${tgtShort(e,sg)}${sg.tag==='up'&&!sg.first?' <span style="color:var(--acc)">↑</span>':''}</span></div>`}).join('');
    nx=`<div class="card stack" style="margin-top:10px;gap:6px"><div class="between"><div class="lab">${dayName} · <span style="color:var(--fg)">${esc(nw.name)}</span></div>${nw.ex.length>3?`<span class="mut" style="font-size:12px">+${nw.ex.length-3} more</span>`:''}</div>${items}</div>`}
  return `<div class="card stack ring" style="--rc:var(--acc);gap:12px"><div class="lab" style="color:var(--acc)">Today · done</div><div class="h1">${esc(last.name)} complete</div>
    <div style="display:grid;grid-template-columns:repeat(${mins?4:3},minmax(0,1fr));gap:6px">${stat(vol.toLocaleString(),'kg lifted')}${stat(prs,'PRs',prs?'var(--gold)':'var(--fg)')}${stat('+'+xp,'XP','var(--acc)')}${mins?stat(mins,'min'):''}</div>
    <div class="mut" style="font-size:12px">${mus.length?`${mus.slice(0,3).join(', ')} need about 48 h before the next hard session. `:''}Protein today: about ${Math.round(S.bw*1.6)} g. Sleep 7+ hours.</div></div>
  ${nx}
  <button style="width:100%;background:none;color:var(--mut);height:40px;font-size:13px;margin-top:4px" onclick="pickAny()">Log another workout</button>`;
}
function pickAny(){pickDay=pickDay==='any'?null:'any';render()}
function questState(){
  const T=today(),d=S.quest.d===T?S.quest.done:[];
  return[{k:'show',t:'Show up',d:'Finish any workout today',xp:50},{k:'beat',t:'Beat last time',d:'Top your last session on 2 exercises',xp:60},{k:'clean',t:'No skips',d:'Do every exercise in the workout',xp:40}].map(x=>({...x,ok:d.includes(x.k)}));
}
function bossOf(w){let b=null;for(const e of w.ex){if(K(e)==='c'||K(e)==='h')continue;const k=S.skips[e.n]||0;if(k>=2&&(!b||k>S.skips[b.n]))b=e}return b}
function startFresh(){S=migrate(Object.assign(emptyState(),{set:S.set}));L=null;try{localStorage.removeItem(DRAFT)}catch(e){}save();go('plan')}

/* ---------- plan ---------- */
function vPlan(){
  const T=today();
  let h=`<div class="h1" style="margin-bottom:4px">Your plan</div><div class="mut" style="margin-bottom:14px">Tap a day to choose what you train. Set it once and the app opens the right workout every day.</div>`+cycleHtml(T)+(Object.keys(S.ovr).some(d=>d>=weekStart(T))?`<div class="banner" style="background:var(--s1);margin-bottom:10px"><span style="flex:1;font-size:13px;color:var(--mut)">This week is shifted after a missed day. Your weekly plan below is unchanged.</span><button class="chip" onclick="clearShift()">Undo shift</button></div>`:'');
  h+=`<div class="stack" style="gap:6px">${DAYS.map((d,i)=>{const w=W(S.week[i]),isT=dow(T)===i;return `<div class="list-row" role="button" tabindex="0" onclick="pickDay=pickDay===${i}?null:${i};render()" style="${isT?'box-shadow:inset 0 0 0 1.5px var(--acc)':''}"><span style="width:42px;color:var(--mut);font-weight:500">${d}</span><span style="flex:1;font-weight:500">${w?esc(w.name):'<span style="color:var(--dim)">Rest</span>'}</span><span class="mut num" style="font-size:12px">${w?w.ex.length+' ex':''}</span>${ic(pickDay===i?'i-up':'i-down','width:18px;height:18px;color:var(--dim)')}</div>${pickDay===i?`<div class="chips" style="padding:4px 2px 8px">${S.workouts.map(w=>`<button class="chip ${S.week[i]===w.id?'on':''}" onclick="assign(${i},'${w.id}')">${esc(w.name)}</button>`).join('')}<button class="chip ${!S.week[i]?'on':''}" onclick="assign(${i},null)">Rest</button></div>`:''}`}).join('')}</div>`;
  h+=`<div class="h2" style="margin:22px 0 10px">Workouts</div>`;
  h+=S.workouts.length?`<div class="stack" style="gap:8px">${S.workouts.map(w=>`<div class="list-row" role="button" tabindex="0" onclick="cur='${w.id}';go('edit')"><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(w.name)}</div><div class="mut num" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.ex.length?w.ex.map(e=>esc(e.n)).join(' · '):'No exercises yet'}</div></div>${ic('i-right','width:18px;height:18px;color:var(--dim)')}</div>`).join('')}</div>`:`<div class="list-row" style="justify-content:center;color:var(--mut);padding:20px">No workouts yet</div>`;
  h+=`<button class="ghost" style="margin-top:10px" onclick="nameSel='';ownName=false;go('name')">${ic('i-plus','width:18px;height:18px;vertical-align:-4px')} New workout</button>`;
  h+=volHtml(T);
  return h;
}
function assign(i,id){S.week[i]=id;pickDay=null;save();sfx.pop();hap(10);render()}
function cycleHtml(T){
  const M=mesoInfo(S.meso.start,T);
  return `<div class="card" style="margin-bottom:14px"><div class="between" style="align-items:flex-start"><div><div class="lab">Training cycle</div><div style="font-weight:600;margin-top:2px">${M.deload?'Deload week':`Week ${M.wk} of ${M.len}`}</div><div class="mut" style="font-size:12px;margin-top:2px">${M.deload?'Half the sets, same weights. Your body catches up and comes back stronger.':`Aim for ${M.rir===0?'0–1':M.rir} reps left in the tank. Effort rises each week, then a deload week.`}</div></div><button class="chip" onclick="S.meso.start=weekStart(today());save();render();toast('Cycle restarted at week 1')">Restart</button></div>
  <div class="row" style="gap:4px;margin-top:10px">${[1,2,3,4,5].map(i=>`<span style="flex:1;height:6px;border-radius:3px;background:${i<M.wk?'var(--acc)':i===M.wk?'var(--fg)':'var(--s2)'}"></span>`).join('')}</div>
  <div class="between mut num" style="font-size:11px;margin-top:4px"><span>RIR 3</span><span>2</span><span>1</span><span>0–1</span><span>Deload</span></div></div>`;
}
// Weekly hard sets per muscle (Schoenfeld 2017: about 10–20) and how many days each muscle is hit.
function volHtml(T){
  const plan={},days={},done={},ws=weekStart(T);
  S.week.forEach((id,i)=>{const w=W(id);if(!w)return;w.ex.forEach(e=>{if(K(e)==='c')return;plan[e.m]=(plan[e.m]||0)+e.sets;(days[e.m]=days[e.m]||new Set()).add(i)})});
  for(const n in S.hist){const m=MUS.find(m=>S.lib[m].includes(n));if(!m||m==='Cardio')continue;for(const h of S.hist[n])if(h.d>=ws&&h.d<=T)done[m]=(done[m]||0)+h.sets.length}
  const ms=MUS.filter(m=>m!=='Cardio'&&(plan[m]||done[m]));
  if(!ms.length)return '';
  return `<div class="h2" style="margin:22px 0 4px">Weekly volume</div><div class="mut" style="margin-bottom:10px">Hard sets per muscle. Research points to about 10–20 a week, spread over 2+ days.</div>
  <div class="stack" style="gap:6px">${ms.map(m=>{const p=plan[m]||0,d=done[m]||0,f=days[m]?days[m].size:0;
    const note=p<10?['var(--gold)',`Below 10. Add ${10-p} set${10-p>1?'s':''} somewhere in the week.`]:p>20?['var(--gold)','Above 20. Fine if you recover, otherwise trim a few.']:f<2?['var(--gold)','Only 1 day a week. Split it over 2 days for better growth.']:['var(--acc)','In the growth range'];
    return `<div class="list-row" style="flex-direction:column;align-items:stretch;gap:6px"><div class="between"><span style="font-weight:500">${m}</span><span class="mut num" style="font-size:12px">${d} done · ${p} planned · ${f} day${f===1?'':'s'}</span></div>
    <div style="position:relative;height:8px;background:var(--s2);border-radius:4px;overflow:hidden"><i style="position:absolute;left:${10/25*100}%;width:${10/25*100}%;top:0;bottom:0;background:var(--acc-soft)"></i><i style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,p/25*100)}%;background:var(--s3)"></i><i style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,d/25*100)}%;background:var(--acc)"></i></div>
    <div style="font-size:12px;color:${note[0]}">${note[1]}</div></div>`}).join('')}</div>`;
}

    <button style="width:100%;height:40px;margin-top:6px;font-size:13px;font-weight:500;${e.rest?'color:var(--acc)':'color:var(--mut)'}" onclick="restOpen=restOpen===${i}?null:${i};render()" aria-expanded="${restOpen===i}">Rest: ${e.rest?restLabel(e.rest):'Auto · '+restLabel(isIso(e)?90:150)} ${ic(restOpen===i?'i-up':'i-down','width:14px;height:14px;vertical-align:-2px')}</button>
    ${restOpen===i?`<div class="row" style="margin-top:6px;gap:6px"><button class="ib" style="width:52px;height:48px" onclick="restD(${i},-15)" aria-label="15 seconds less">−15</button><div class="disp num" style="flex:1;text-align:center;font-size:30px">${restLabel(e.rest||(isIso(e)?90:150))}</div><button class="ib" style="width:52px;height:48px" onclick="restD(${i},15)" aria-label="15 seconds more">+15</button><button class="chip ${e.rest?'':'on'}" style="height:48px" onclick="restAuto(${i})">Auto</button></div>`:''}`}</div>`).join('')}</div>`:`<div class="list-row" style="justify-content:center;color:var(--mut);padding:20px">No exercises yet</div>`;
  {const fc=w.ex.findIndex(e=>K(e)==='c'),ll=w.ex.map(e=>K(e)!=='c').lastIndexOf(true);
   if(fc>=0&&fc<ll)h+=`<div class="banner" style="background:rgba(255,178,63,.12);color:var(--gold);margin-top:10px;font-size:13px">Move cardio to the end. Lifting first keeps your strength up (the interference effect).</div>`}
  h+=`<button class="ghost" style="margin-top:10px" onclick="libF='Chest';libQ='';customOpen=false;go('lib')">${ic('i-plus','width:18px;height:18px;vertical-align:-4px')} Add exercises</button>`;
  h+=`<button class="pri" style="margin-top:12px" onclick="go('plan')">Save workout</button>`;
  h+=confirmReset==='del'?`<div class="card stack ring" style="--rc:var(--bad);margin-top:12px"><div>Delete ${esc(w.name)}? Days using it become rest days. Exercise history stays.</div><div class="row"><button class="sec" onclick="confirmReset=false;render()">Keep</button><button class="sec" style="background:var(--bad);color:#2A0B0B" onclick="delW()">Delete</button></div></div>`:`<button style="width:100%;height:44px;margin-top:10px;background:none;color:var(--bad);font-size:13px" onclick="confirmReset='del';render()">Delete workout</button>`;
  return h;
}
function mv(i,d){const a=W(cur).ex,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();sfx.tap();render()}
function rmEx(i){const a=W(cur).ex,x=a.splice(i,1)[0];save();render();toast(`${x.n} removed`,()=>{a.splice(i,0,x);save();render()})}
function setsD(i,d){const e=W(cur).ex[i];e.sets=Math.min(10,Math.max(1,e.sets+d));save();sfx.tap();hap(6);render()}
function rrNext(i){const e=W(cur).ex[i];e.rr=RR[(RR.indexOf(e.rr)+1)%RR.length];save();sfx.tap();hap(6);render()}
function incNext(i){const e=W(cur).ex[i],o=[1,2.5,5];e.inc=o[(o.indexOf(e.inc)+1)%o.length];save();sfx.tap();render()}
function delW(){S.workouts=S.workouts.filter(w=>w.id!==cur);S.week=S.week.map(x=>x===cur?null:x);save();go('plan')}

  const w=W(cur);if(!w){view='plan';return vPlan()}
  return `<div class="row" style="margin-bottom:12px"><button class="ib" onclick="go('edit')" aria-label="Back">${ic('i-left')}</button><div style="flex:1;min-width:0"><div class="h1">Add to ${esc(w.name)}</div><div class="mut" id="libCount">${w.ex.length} added · tap to add or remove</div></div></div>

function libList(){return libQ?MUS.flatMap(m=>S.lib[m].filter(n=>n.toLowerCase().includes(libQ.toLowerCase())).map(n=>[m,n])):S.lib[libF].map(n=>[libF,n])}

  const have=new Set(W(cur).ex.map(e=>e.n)),list=libList();
  return `${libQ?'':`<div class="chips" style="margin-bottom:12px">${MUS.map(m=>`<button class="chip ${m===libF?'on':''}" onclick="libF='${m}';customOpen=false;renderLib()">${m}</button>`).join('')}</div>`}
  <div class="stack" style="gap:6px">${list.map(([m,n])=>`<div class="list-row" role="button" tabindex="0" onclick="togEx(${MUS.indexOf(m)},${S.lib[m].indexOf(n)})"><div style="flex:1"><div style="font-weight:500">${esc(n)}</div>${libQ?`<div class="mut" style="font-size:12px">${m}</div>`:''}</div>${have.has(n)?ic('i-check','width:24px;height:24px;color:var(--acc)'):ic('i-plus','width:24px;height:24px;color:var(--dim)')}</div>`).join('')||'<div class="list-row" style="color:var(--mut)">No match. Create it below.</div>'}</div>
  ${customOpen?`<div class="card stack" style="margin-top:10px"><div class="lab">New exercise</div><input id="cn" placeholder="Landmine press" maxlength="28" value="${esc(libQ)}" oninput="$('er2').textContent=''"><div class="chips" id="cmus">${MUS.map(m=>`<button class="chip ${m===libF?'on':''}" onclick="libF='${m}';document.querySelectorAll('#cmus .chip').forEach(c=>c.classList.toggle('on',c.textContent==='${m}'))">${m}</button>`).join('')}</div><div class="lab" style="margin-top:4px">Type</div><div class="chips" id="ckind">${[['w','Weights'],['bw','Bodyweight'],['h','Timed hold'],['c','Cardio']].map(([k,l])=>`<button class="chip ${k===customKind?'on':''}" onclick="customKind='${k}';document.querySelectorAll('#ckind .chip').forEach(c=>c.classList.toggle('on',c.textContent==='${l}'))">${l}</button>`).join('')}</div><div class="err" id="er2"></div><button class="sec on" onclick="addCustom()">Add to library</button></div>`:`<button class="ghost" style="margin-top:10px" onclick="customOpen=true;renderLib();setTimeout(()=>$('cn')&&$('cn').focus(),30)">${ic('i-edit','width:16px;height:16px;vertical-align:-3px')} Not listed? Create it once</button>`}`;
}
function renderLib(){$('libBody').innerHTML=libBody();$('libCount').textContent=`${W(cur).ex.length} added · tap to add or remove`}
function togEx(mi,ni){const m=MUS[mi],n=S.lib[m][ni],a=W(cur).ex,i=a.findIndex(e=>e.n===n);
  if(i>=0){a.splice(i,1);sfx.tap()}else{const k=kindOf({n,m},S.kinds);a.push({n,m,k,sets:k==='c'?1:3,rr:k==='h'?'20–60':k==='bw'||SMALL.test(n)||['Biceps','Triceps','Calves','Abs'].includes(m)?'10–15':'6–10',inc:SMALL.test(n)?1:2.5});sfx.pop()}
  hap(8);save();renderLib()}
function addCustom(){const n=$('cn').value.trim();if(!n){$('er2').textContent='Type the exercise name first';return}
  if(n in Object.prototype){$('er2').textContent='Pick a different name';return}
  if(MUS.some(m=>S.lib[m].some(x=>x.toLowerCase()===n.toLowerCase()))){$('er2').textContent='Already in your library. Search for it above.';return}
  const m=customKind==='c'?'Cardio':libF;
  S.kinds[n]=customKind;S.lib[m].push(n);libF=m;customOpen=false;libQ='';customKind='w';$('libq').value='';togEx(MUS.indexOf(m),S.lib[m].length-1)}
let customKind='w';

/* ---------- logger ---------- */
const DRAFT='ironquest-draft';
let CW=0,CR=0,CRIR=2,CC={min:20,kmh:5,inc:0},rest=null,confirmZero=false;
function startWorkout(wid,ready){
  const w=W(wid);if(!w||!w.ex.length){cur=wid;go('edit');return}
  ac();
  if(!ready){
    sfx.pop();
    $('sheet').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet stack" style="gap:12px"><div class="h1">How do you feel today?</div><div class="mut">Sleep, soreness, energy. One tap and the app adjusts the workout.</div>
      <button class="pri" onclick="closeSheet();startWorkout('${wid}','good')">Strong · ready to push</button>
      <button class="sec" onclick="closeSheet();startWorkout('${wid}','ok')">Normal</button>
      <button class="sec" onclick="closeSheet();startWorkout('${wid}','low')">Tired or sore · go lighter</button></div></div>`;
    return;
  }
  sfx.slam();hap(30);
  const boss=bossOf(w),M=mesoInfo(S.meso.start,today());
  L={wid,name:w.name,i:0,t0:Date.now(),xp:0,prs:0,beat:new Set(),ready,deload:M.deload,rirT:M.rir,ex:w.ex.map(e=>{
    const k=K(e),t=suggest({...e,k},S.hist);let sets=k==='c'?1:e.sets;
    if(k==='c'){if(ready==='low')t.c={...t.c,min:Math.max(5,Math.round(t.c.min*.75))}}
    else{if(M.deload)sets=Math.max(1,Math.ceil(sets/2));if(ready==='low')sets=Math.max(1,sets-1);t.reps=t.reps.slice(0,sets)}
    const isBoss=!!(boss&&boss.n===e.n),hp=isBoss?Math.max(1,Math.round((k==='bw'?S.bw+t.w:t.w||20)*t.reps.reduce((a,b)=>a+b,0))):0;
    return{n:e.n,m:e.m,k,rr:e.rr,inc:e.inc,rest:e.rest||0,sets,t,log:[],skip:false,boss:isBoss,hp,hpMax:hp}})};
  setTimeout(()=>toast(M.deload?'Deload week: half the sets, same weights. Recovery is part of the plan.':ready==='low'?'Lighter day: one set less on each exercise.':ready==='good'?`Feeling strong. Aim for ${M.rir===0?'0–1':M.rir} reps left on each set.`:`Week ${M.wk}: aim for ${M.rir===0?'0–1':M.rir} reps left on each set.`),400);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{if(L)L.lock=l}).catch(()=>{})}catch(e){}
  loadSet();view='log';render();scrollTo(0,0);saveDraft();
}
function curEx(){return L.ex[L.i]}
function loadSet(){const x=curEx(),k=Math.min(x.log.length,x.t.reps.length-1),ll=x.log[x.log.length-1];
  if(x.k==='c'){const c=ll||x.t.c;CC={min:c.min,kmh:c.kmh,inc:c.inc,eff:c.eff||'easy'};confirmZero=false;return}
  CW=ll?ll.w:x.t.w;CR=x.t.reps[Math.max(0,k)];CRIR=2;confirmZero=false}
function lastSetFor(x,k){const H=S.hist[x.n];if(!H||!H.length)return null;const s=H[H.length-1].sets;return s[Math.min(k,s.length-1)]}
// One number per set to compare and chart: distance for cardio, estimated 1RM otherwise.
const score=(x,s)=>{const k=x.k||K(x);return k==='c'?dist(s):k==='h'?s.r+2*s.w:e1(ld(x,s.w),s.r)};
const beats=(x,s,l)=>!!l&&score(x,s)>score(x,l)+(x.k==='c'?.01:.5);
function bestScore(x){const H=S.hist[x.n]||[];let b=S.best&&S.best[x.n]||0;H.forEach(h=>h.sets.forEach(s=>{b=Math.max(b,score(x,s))}));return b}
function delta(s,l,x){
  if(!l)return '<span class="bd eq">first</span>';
  if(x&&x.k==='c'){const d=dist(s)-dist(l);return Math.abs(d)<.01?'<span class="bd eq">= same</span>':d>0?`<span class="bd up">↑ +${d.toFixed(2)} km</span>`:`<span class="bd dn">↓ ${d.toFixed(2)} km</span>`}

  const got=BADGES.filter(b=>S.badges[b.k]).length;
  h+=`<div class="between" style="margin-bottom:10px"><div class="h2">Badges</div><span class="mut num">${got}/${BADGES.length}</span></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">${BADGES.map(b=>{const g=S.badges[b.k],c=RC[b.r];return `<div class="badge ${g?'got':''}" title="${b.d}"><div class="bi" style="${g?`box-shadow:0 0 0 1.5px ${c};color:${c}`:''}">${ic(g?b.i:'i-lock','width:22px;height:22px')}</div><span style="line-height:1.2">${b.n}</span></div>`}).join('')}</div>`;
  const ex=Object.keys(S.hist).filter(n=>S.hist[n].length);
  h+=`<div class="h2" style="margin:22px 0 4px">Progress per exercise</div><div class="mut" style="margin-bottom:10px">Estimated 1RM for lifts, distance for cardio</div>`;
  PEX=ex;
  h+=ex.length?`<div class="stack" style="gap:6px">${ex.map((n,i)=>{const x={n,m:MUS.find(m=>S.lib[m].includes(n))||''};x.k=K(x);const H=S.hist[n],c=x.k==='c',pts=H.map(h=>Math.max(...h.sets.map(s=>x.k==='h'?s.r:score(x,s)))),b=pts[pts.length-1],d=b-pts[0],u=c?' km':x.k==='h'?' s':' kg',f=v=>c?v.toFixed(2):Math.round(v);return `<div class="list-row" role="button" tabindex="0" onclick="openEx(${i})"><div style="flex:1;min-width:0"><div style="font-weight:500;font-size:14px">${esc(n)}</div><div class="mut num" style="font-size:12px">${f(b)}${u}${H.length>1?` · <span style="color:${d>=0?'var(--acc)':'var(--bad)'}">${d>=0?'+':''}${f(d)}</span> over ${H.length} sessions`:''}</div></div>${spark(pts)}${ic('i-right','width:16px;height:16px;color:var(--dim)')}</div>`}).join('')}</div>`:`<div class="list-row mut" style="justify-content:center;padding:20px">Finish a workout to see strength trends</div>`;
  h+=`<div class="h2" style="margin:22px 0 10px">Recent workouts</div>`;
  h+=S.sessions.length?`<div class="stack" style="gap:6px">${S.sessions.slice(-8).reverse().map(s=>`<div class="list-row"><div style="flex:1"><div style="font-weight:500;font-size:14px">${esc(s.name)}</div><div class="mut num" style="font-size:12px">${new Date(s.d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})} · ${s.vol.toLocaleString()} kg${s.prs?` · ${s.prs} PR`:''}</div></div><span class="num" style="color:var(--acc);font-weight:600;font-size:13px">+${s.xp} XP</span></div>`).join('')}</div>`:`<div class="list-row mut" style="justify-content:center;padding:20px">No workouts yet</div>`;
  h+=`<div class="h2" style="margin:22px 0 10px">Settings</div><div class="stack" style="gap:6px">
    <button class="list-row" style="width:100%;text-align:left" onclick="S.set.sound=!S.set.sound;save();sfx.pop();render()">${ic('i-sound')}<span style="flex:1">Sound effects</span><span style="color:${S.set.sound?'var(--acc)':'var(--dim)'};font-weight:600">${S.set.sound?'On':'Off'}</span></button>
    <div class="list-row">${ic('i-weight')}<div style="flex:1"><div>Your bodyweight</div><div class="mut" style="font-size:12px">Used for bodyweight exercises and cardio calories</div></div><button class="ib" onclick="S.bw=Math.max(30,S.bw-1);save();sfx.tap();render()" aria-label="Decrease bodyweight">−</button><span class="num" style="min-width:48px;text-align:center;font-weight:600">${S.bw} kg</span><button class="ib" onclick="S.bw=Math.min(250,S.bw+1);save();sfx.tap();render()" aria-label="Increase bodyweight">+</button></div>
    <button class="list-row" style="width:100%;text-align:left" onclick="const k=Object.keys(LOGMODES);S.set.logMode=k[(k.indexOf(S.set.logMode||'tap')+1)%k.length];save();render()">${ic('i-check')}<span style="flex:1">Log a set by<div class="mut" style="font-size:12px">Tap to change. Undo is there for 5 s after every set.</div></span><span style="color:var(--acc);font-weight:600">${LOGMODES[S.set.logMode||'tap']}</span></button>
    <button class="list-row" style="width:100%;text-align:left" onclick="S.set.haptics=!S.set.haptics;save();hap(30);render()">${ic('i-vib')}<span style="flex:1">Vibration</span><span style="color:${S.set.haptics?'var(--acc)':'var(--dim)'};font-weight:600">${S.set.haptics?'On':'Off'}</span></button>
    ${window.IQ_PWA?`<button class="list-row" style="width:100%;text-align:left" onclick="exportData()">${ic('i-down')}<span style="flex:1">Back up data<div class="mut" style="font-size:12px">${S.lastBackup?'Last backup '+S.lastBackup:'Never backed up'} · saves a file to your phone</div></span></button>
    <label class="list-row" style="cursor:pointer">${ic('i-up')}<span style="flex:1">Restore from backup<div class="mut" style="font-size:12px">Pick a backup file</div></span><input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''"></label>`:''}
    ${confirmReset===true?`<div class="card stack ring" style="--rc:var(--bad)"><div>Delete all workouts, history, XP and badges? This can't be undone.</div><div class="row"><button class="sec" onclick="confirmReset=false;render()">Cancel</button><button class="sec" style="background:var(--bad);color:#2A0B0B" onclick="startFresh()">Delete all</button></div></div>`:`<button class="list-row" style="width:100%;text-align:left;color:var(--bad)" onclick="confirmReset=true;render()">${ic('i-trash')}<span style="flex:1">Delete all data</span></button>`}
  </div>`;
  return h;
}

/* ---------- exercise detail ---------- */
let PEX=[],exN=null,exMet='a',exSel=null;
function openEx(i){exN=PEX[i];exMet='a';exSel=null;go('ex')}
function vEx(){
  const n=exN,H=S.hist[n]||[];if(!n||!H.length){view='progress';return vProgress()}
  const x={n,m:MUS.find(m=>S.lib[m].includes(n))||''};x.k=K(x);const c=x.k==='c',bw=x.k==='bw',hd=x.k==='h';
  // Next target comes from the plan's settings for this exercise when it is in a workout.
  let pe=null;for(const w of S.workouts){const e=w.ex.find(e=>e.n===n);if(e){pe=e;break}}
  const def=pe||{n,m:x.m,rr:hd?'20–60':bw?'10–15':'6–10',inc:2.5,sets:H[H.length-1].sets.length};
  const t=suggest({...def,k:x.k},S.hist);
  const METS=hd?{a:['Best hold',h=>Math.max(...h.sets.map(s=>s.r)),' s',0],b:['Total time',h=>h.sets.reduce((a,s)=>a+s.r,0),' s',0],v:['Extra weight',h=>Math.max(...h.sets.map(s=>s.w)),' kg',1]}:c?{a:['Distance',h=>Math.max(...h.sets.map(dist)),' km',2],b:['Minutes',h=>h.sets.reduce((a,s)=>a+s.min,0),' min',0],v:['Speed',h=>Math.max(...h.sets.map(s=>s.kmh)),' km/h',1]}
    :{a:['Strength',h=>Math.max(...h.sets.map(s=>score(x,s))),' kg',0],b:[bw?'Total reps':'Top weight',h=>bw?h.sets.reduce((a,s)=>a+s.r,0):Math.max(...h.sets.map(s=>s.w)),bw?' reps':' kg',1],v:['Volume',h=>h.sets.reduce((a,s)=>a+ld(x,s.w)*s.r,0),' kg',0]};
  const met=METS[exMet]||METS.a,vals=H.map(met[1]),sc=H.map(h=>Math.max(...h.sets.map(s=>hd?s.r:score(x,s)))),scp=H.map(h=>Math.max(...h.sets.map(s=>score(x,s))));
  let best=-1,prs=[];scp.forEach((v,i)=>{if(v>best+1e-9){if(i>0)prs.push(i);best=v}});
  const f=(v,dp)=>dp?(Math.round(v*10**dp)/10**dp).toLocaleString():Math.round(v).toLocaleString();
  const first=sc[0],last=sc[sc.length-1],gain=last-first,pct=first?Math.round(gain/first*100):0;
  const sel=exSel==null?H.length-1:exSel;
  const dlab=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  // target line
  const tline=hd?`<span class="disp" style="font-size:52px;color:var(--acc)">${t.reps.join(', ')}</span><span class="mut" style="font-size:14px">s${t.w?' · +'+fmt(t.w)+' kg':''}</span>`:c?`<span class="disp" style="font-size:52px;color:var(--acc)">${t.c.min}</span><span class="mut" style="font-size:14px">min ·</span><span class="disp" style="font-size:52px">${fmt(t.c.kmh)}</span><span class="mut" style="font-size:14px">km/h · ${t.c.inc}%</span>`
    :`<span class="disp" style="font-size:52px;color:var(--acc)">${bw?(t.w?'BW+'+fmt(t.w):'BW'):t.first?'—':fmt(t.w)}</span><span class="mut" style="font-size:14px">${bw||t.first?'':'kg '}×</span><span class="disp" style="font-size:52px">${t.reps.join(', ')}</span>`;
  // chart
  const W0=340,mn=Math.min(...vals),mx=Math.max(...vals),pd=(mx-mn)*.25||1,lo=mn-pd,hi=mx+pd,N=vals.length;
  const X=i=>N===1?170:20+i*(300/(N-1)),Y=v=>130-(v-lo)/(hi-lo)*110;
  const dP=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let g=`<defs><linearGradient id="exfa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8F031" stop-opacity=".28"/><stop offset="1" stop-color="#C8F031" stop-opacity="0"/></linearGradient></defs>`;
  [lo+(hi-lo)*.25,lo+(hi-lo)*.75].forEach(v=>{g+=`<line x1="20" x2="320" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="324" y="${Y(v)+4}" fill="var(--dim)" font-size="10">${f(v,met[3])}</text>`});
  if(N>1)g+=`<path d="${dP} L${X(N-1)} 135 L20 135Z" fill="url(#exfa)"/><path d="${dP}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(200,240,49,.6))"/>`;
  const step=Math.ceil(N/7);
  vals.forEach((v,i)=>{const on=i===sel,pr=prs.includes(i);g+=`<g style="cursor:pointer" onclick="exSel=${i};render()"><circle cx="${X(i)}" cy="${Y(v)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(v)}" r="${on?7:4.5}" fill="${on?'var(--acc)':'var(--bg)'}" stroke="${pr?'var(--gold)':'var(--acc)'}" stroke-width="2.5"/>${pr?`<text x="${X(i)}" y="${Y(v)-12}" text-anchor="middle" fill="var(--gold)" font-size="9" font-weight="600">PR</text>`:''}${i%step===0||on?`<text x="${X(i)}" y="148" text-anchor="middle" fill="${on?'var(--fg)':'var(--dim)'}" font-size="10">${dlab(H[i].d).replace(/\D+/,' ').trim().split(' ').pop()}</text>`:''}</g>`});
  const tx=Math.min(270,Math.max(50,X(sel))),ty=Y(vals[sel]);
  g+=`<rect x="${tx-38}" y="${ty-42}" width="76" height="22" rx="6" fill="var(--fg)"/><text x="${tx}" y="${ty-27}" text-anchor="middle" fill="var(--bg)" font-size="12" font-weight="600">${f(vals[sel],met[3])}${met[2]}</text>`;
  // sessions
  const setTxt=s=>setText(x,s);
  let list='';
  for(let i=H.length-1;i>=Math.max(0,H.length-8);i--){
    const h=H[i],p=H[i-1],v=sc[i],dv=p?v-sc[i-1]:0,on=i===sel,thr=c?.01:.4;
    const summ=hd?`${h.sets[0].w?'+'+fmt(h.sets[0].w)+' kg · ':''}${h.sets.map(s=>s.r).join(', ')} s`:c?setTxt(h.sets[0]):`${bw?(h.sets[0].w?'BW+'+fmt(h.sets[0].w):'BW'):fmt(h.sets[0].w)+' kg'} × ${h.sets.map(s=>s.r).join(', ')}`;
    list+=`<div class="list-row" role="button" tabindex="0" style="flex-direction:column;align-items:stretch;${on?'box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--s2)':''}" onclick="exSel=${i};render()">
      <div class="between"><div style="min-width:0"><div style="font-weight:600">${dlab(h.d)}${prs.includes(i)?` <span style="color:var(--gold);font-size:11px;font-weight:700">PR</span>`:''}</div><div class="mut num" style="font-size:12px">${summ}</div></div>
      <div style="text-align:right;flex-shrink:0"><div class="disp num" style="font-size:26px">${c?v.toFixed(2):Math.round(v)}<span class="mut" style="font-family:var(--f-body);font-size:11px"> ${c?'km':hd?'s':'e1RM'}</span></div>${p?`<span class="bd ${dv>thr?'up':dv<-thr?'dn':'eq'}">${dv>thr?'↑ +':dv<-thr?'↓ ':'= '}${dv>thr||dv<-thr?(c?Math.abs(dv).toFixed(2):Math.round(Math.abs(dv)*10)/10):'same'}</span>`:''}</div></div>
      ${on?`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:6px">${h.sets.map((s,k)=>`<div class="between num" style="font-size:13px;padding:4px 0"><span class="mut">${c?'Done':'Set '+(k+1)}</span><span class="row" style="gap:8px">${setTxt(s)}${c?`<span class="mut" style="font-size:12px">${dist(s).toFixed(2)} km</span>`:`<span class="mut" style="font-size:12px">RIR ${s.rir===3?'3+':s.rir}</span>`}${delta(s,p&&p.sets[Math.min(k,p.sets.length-1)],x)}</span></div>`).join('')}</div>`:''}
    </div>`;
  }
  const u=c?' km':hd?' s':' kg';
  return `<div class="row" style="margin-bottom:14px"><button class="ib" onclick="go('progress')" aria-label="Back">${ic('i-left')}</button><div style="flex:1;min-width:0"><div class="h1" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</div><div class="mut">${esc(x.m)}${pe&&!c&&!hd?' · '+pe.sets+' × '+pe.rr:''} · ${H.length} session${H.length>1?'s':''}</div></div></div>
  <div class="card ring" style="--rc:var(--acc)"><div class="lab" style="color:var(--acc)">Next session</div><div class="row num" style="gap:8px;align-items:baseline;margin-top:6px;flex-wrap:wrap">${tline}</div><div style="font-size:12px;margin-top:4px;color:${t.tag==='up'?'var(--acc)':t.tag==='dn'?'var(--bad)':'var(--mut)'}">${esc(t.why)}</div>${pe?'':`<div class="mut" style="font-size:11px;margin-top:4px">Not in any workout right now. Add it to a workout to use this target.</div>`}</div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px">
    <div class="sc" style="opacity:1"><span class="lab">${c||hd?'Best':'Best e1RM'}</span><b class="num">${c?Math.max(...sc).toFixed(2):Math.round(Math.max(...sc))}</b><span class="mut" style="font-size:11px">${u.trim()}</span></div>
    <div class="sc" style="opacity:1"><span class="lab">${H.length>=12?'Last 12':'Since start'}</span><b class="num" style="color:${gain>=0?'var(--acc)':'var(--bad)'}">${gain>=0?'+':''}${c?gain.toFixed(2):Math.round(gain)}</b><span class="mut" style="font-size:11px">${u.trim()} · ${pct>=0?'+':''}${pct}%</span></div>
    <div class="sc" style="opacity:1"><span class="lab">PRs</span><b class="num" style="color:var(--gold)">${prs.length}</b><span class="mut" style="font-size:11px">records</span></div>
  </div>
  <div class="row" style="gap:4px;background:var(--s1);border-radius:10px;padding:3px;margin-top:14px">${Object.entries(METS).map(([k,m])=>`<button style="flex:1;height:34px;font-size:12px;font-weight:600;background:${k===exMet?'var(--acc)':'none'};color:${k===exMet?'var(--on-acc)':'var(--mut)'}" onclick="exMet='${k}';render()">${m[0]}</button>`).join('')}</div>
  <svg viewBox="0 0 ${W0} 152" width="100%" style="display:block;overflow:visible;margin-top:12px;font-family:var(--f-body)" role="img" aria-label="${met[0]} per session">${g}</svg>
  <div class="mut" style="text-align:center;font-size:12px">${met[0]} per session · tap a point</div>
  <div class="between" style="margin:18px 0 4px"><div class="h2">Previous sessions</div><span class="mut" style="font-size:12px">vs the one before</span></div>
  <div class="stack" style="gap:6px">${list}</div>`;
}

/* ---------- backup (installed app only: data lives only on this phone) ---------- */
function exportData(){
  const T=today(),blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`ironquest-backup-${T}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);S.lastBackup=T;save();render();toast('Backup saved to your downloads');
}
let pendingRestore=null;
function importData(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(e){toast("That file isn't a backup.");return}
    // The file is outside input: check its shape before it replaces everything.
    if(!d||d.v!==1||!Array.isArray(d.workouts)||!Array.isArray(d.sessions)||typeof d.hist!=='object'||!Array.isArray(d.week)||d.week.length!==7){toast("That file isn't an IronQuest backup.");return}
    pendingRestore=d;
    $('sheet').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet stack"><div class="h1">Restore backup?</div><div class="mut">This replaces everything on this phone with the backup: ${d.workouts.length} workouts, ${d.sessions.length} logged sessions${d.lastBackup?', saved '+esc(d.lastBackup):''}.</div><button class="pri" onclick="doRestore()">Restore</button><button class="sec" onclick="pendingRestore=null;closeSheet()">Cancel</button></div></div>`};
  rd.readAsText(f);
}
function doRestore(){if(!pendingRestore)return;S=migrate(pendingRestore);pendingRestore=null;L=null;try{localStorage.removeItem(DRAFT)}catch(e){}closeSheet();save();go('home');toast('Backup restored')}
if(window.IQ_PWA&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ---------- render ---------- */
function render(){
  if(view==='log'&&!L)view='home';
  if(view==='reward'&&!R)view='home';
  const V={home:vHome,plan:vPlan,name:vName,edit:vEdit,lib:vLib,log:vLog,reward:vReward,progress:vProgress,ex:vEx}[view]||vHome;
  let html=V();
  if(L&&view!=='log')html=`<button class="banner" style="width:100%;background:var(--acc);color:var(--on-acc);margin-bottom:14px;font-weight:600" onclick="view='log';render()">${ic('i-play','width:18px;height:18px;fill:currentColor')}<span style="flex:1;text-align:left">${esc(L.name)} in progress</span>Resume</button>`+html;
  $('app').innerHTML=`<div class="view${enterNext?' enter':''}">${html}</div>`;enterNext=false;
  $('tabs').hidden=!['home','plan','progress','name','edit','lib','ex'].includes(view);
  const tv=['name','edit','lib'].includes(view)?'plan':view==='ex'?'progress':view;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('act',t.dataset.v===tv));
  if(view==='log')bindLog();
}
render();

/* self-check of core logic (console only) */
(function(){
  const H=(w,rs,rir)=>({sets:rs.map(r=>({w,r,rir}))}),ex={n:'X',rr:'6–10',inc:2.5,sets:3};
  console.assert(suggest(ex,{X:[H(60,[10,10,10],1)]}).w===62.5,'top of range adds weight');
  console.assert(suggest(ex,{X:[H(60,[7,7,7],1),H(60,[8,8,7],1)]}).reps.join()==='9,9,8','mid range adds reps');
  console.assert(suggest(ex,{X:[H(60,[9,9,9],1),H(60,[9,9,8],1),H(60,[8,7,7],0)]}).w===55,'two drops deload');
  console.assert(suggest(ex,{X:[H(60,[10,10,10],1),H(62.5,[5,5,5],0)]}).w===60,'big jump goes back');
  const wk=['a','a','a','a','a','a',null];
  console.assert(bumpStreak({n:4,last:'2026-11-16',freezes:0},'2026-11-17',wk).n===5,'next day continues');
  console.assert(bumpStreak({n:4,last:'2026-11-16',freezes:0},'2026-11-19',wk).n===1,'missed days reset');
  console.assert(bumpStreak({n:4,last:'2026-11-16',freezes:2},'2026-11-19',wk).used===2,'freezes cover misses');
  console.assert(levelInfo(300).lv===2&&levelInfo(299).lv===1,'level thresholds');
})();
